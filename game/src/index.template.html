<title>BRASA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap">
<style>
  :root{
    --tscale:1;
    --bg:#0a0710;
    --ink:#f3e9dd;
    --dim:#9b8ba0;
    --hot:#ff9d3d;
    --hotter:#ffd98a;
    --danger:#ff4d6d;
    --panel:rgba(14,10,20,0.92);
    --line:rgba(255,157,61,0.22);
    --font:'Rajdhani','Segoe UI',system-ui,sans-serif;
  }
  html[data-palette="daltonico"]{ --hot:#ffd166; --hotter:#ffe3a3; --danger:#4cc9f0; --line:rgba(255,209,102,0.24); }
  html[data-palette="contraste"]{ --bg:#000; --ink:#fff; --dim:#bdbdbd; --hot:#fc0; --hotter:#fff; --danger:#ff2b2b; --panel:rgba(0,0,0,0.95); --line:rgba(255,204,0,0.5); }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font);
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
    touch-action:none;
  }
  #game{position:fixed;inset:0;display:block;background:var(--bg);cursor:crosshair}
  body:not(.playing) #game{cursor:default}

  /* ---------- camada de menus ---------- */
  #ui{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    padding:calc(24px * var(--tscale));
    font-size:calc(16px * var(--tscale));
    overflow-y:auto;
    z-index:10;
  }
  #ui[hidden]{display:none}
  .screen{display:none;width:100%;max-width:min(1080px,100%);animation:rise .22s ease-out}
  .screen.on{display:block}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.screen{animation:none}}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    padding:calc(28px * var(--tscale));
    max-width:min(560px,100%);
    margin:0 auto;
    box-shadow:0 24px 80px rgba(0,0,0,.65);
  }
  .panel.wide{max-width:min(1000px,100%)}

  h1,h2,h3{margin:0;font-weight:700;letter-spacing:.01em;text-wrap:balance}
  h2{font-size:calc(30px * var(--tscale));margin-bottom:calc(14px * var(--tscale));letter-spacing:.04em;text-transform:uppercase}
  h2.dead{color:var(--danger)}
  h2.win{color:var(--hotter)}
  h3{font-size:calc(13px * var(--tscale));text-transform:uppercase;letter-spacing:.18em;color:var(--hot);margin:calc(20px * var(--tscale)) 0 calc(10px * var(--tscale))}
  h3:first-child{margin-top:0}
  p{margin:0 0 calc(12px * var(--tscale));line-height:1.55;color:#d9cfc6}
  p.fine{font-size:calc(13.5px * var(--tscale));color:var(--dim);line-height:1.5}
  b{color:var(--hotter);font-weight:700}
  i{color:var(--dim)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- título ---------- */
  .titlewrap{text-align:center;padding:calc(20px * var(--tscale))}
  .logo{
    font-size:clamp(64px, 16vw, 168px);
    font-weight:700;letter-spacing:.16em;line-height:.94;
    display:flex;justify-content:center;gap:.02em;
    filter:drop-shadow(0 0 40px rgba(255,157,61,.35));
  }
  .logo span{
    background:linear-gradient(180deg,var(--hotter) 0%,var(--hot) 55%,#a03a12 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:flick 2.6s ease-in-out infinite;
  }
  .logo .l2{animation-delay:.2s}.logo .l3{animation-delay:.45s}
  .logo .l4{animation-delay:.15s}.logo .l5{animation-delay:.6s}
  @keyframes flick{0%,100%{opacity:1}45%{opacity:.82}70%{opacity:.95}}
  @media (prefers-reduced-motion:reduce){.logo span{animation:none}}
  .tag{color:var(--dim);font-size:calc(17px * var(--tscale));line-height:1.5;margin:calc(6px * var(--tscale)) 0 calc(26px * var(--tscale))}
  .hint{color:var(--dim);font-size:calc(13px * var(--tscale));margin-top:calc(20px * var(--tscale))}

  /* ---------- botões ---------- */
  .menu{display:flex;flex-direction:column;gap:calc(9px * var(--tscale));align-items:center}
  .menu.row{flex-direction:row;justify-content:center;flex-wrap:wrap;margin-top:calc(22px * var(--tscale))}
  .menu.tight{margin-top:calc(10px * var(--tscale))}
  button{
    font-family:var(--font);
    font-size:calc(17px * var(--tscale));
    font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink);
    background:transparent;
    border:1px solid rgba(255,255,255,.16);
    padding:calc(11px * var(--tscale)) calc(30px * var(--tscale));
    min-width:calc(210px * var(--tscale));
    cursor:pointer;
    transition:background .12s,border-color .12s,color .12s,transform .08s;
  }
  .menu.row button{min-width:calc(150px * var(--tscale))}
  button:hover{background:rgba(255,157,61,.1);border-color:var(--hot)}
  button:focus-visible{outline:2px solid var(--hotter);outline-offset:3px}
  button:active{transform:translateY(1px)}
  button.primary{border-color:var(--hot);color:var(--hotter)}
  button.primary:hover{background:var(--hot);color:#160b02}
  button.danger{border-color:rgba(255,77,109,.4);color:var(--danger)}
  button.danger:hover{background:rgba(255,77,109,.16)}

  /* ---------- colunas ---------- */
  .cols{display:grid;grid-template-columns:1fr;gap:calc(26px * var(--tscale))}
  @media (min-width:820px){.cols{grid-template-columns:repeat(3,1fr)}}
  .cols section{min-width:0}

  ul.bullets{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:calc(7px * var(--tscale));color:#d9cfc6;font-size:calc(15px * var(--tscale));line-height:1.45}
  ul.bullets li::marker{color:var(--hot)}
  ul.keys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:calc(7px * var(--tscale))}
  ul.keys li{display:flex;align-items:center;gap:calc(8px * var(--tscale));font-size:calc(15px * var(--tscale))}
  ul.keys li span{flex:1;color:var(--dim)}
  kbd{
    font-family:var(--font);font-weight:600;font-size:calc(12.5px * var(--tscale));
    border:1px solid rgba(255,255,255,.2);padding:calc(3px * var(--tscale)) calc(8px * var(--tscale));
    background:rgba(255,255,255,.05);white-space:nowrap;
  }

  /* ---------- controles ---------- */
  .ctl{display:flex;align-items:center;gap:calc(10px * var(--tscale));margin-bottom:calc(11px * var(--tscale));font-size:calc(14.5px * var(--tscale));color:#cdc3ba}
  .ctl > span{flex:0 0 calc(120px * var(--tscale))}
  .ctl.check{align-items:flex-start}
  .ctl.check > span{flex:1}
  input[type=range]{flex:1;accent-color:var(--hot);min-width:0}
  input[type=checkbox]{width:calc(18px * var(--tscale));height:calc(18px * var(--tscale));accent-color:var(--hot);flex:none}
  select{
    flex:1;font-family:var(--font);font-size:calc(14.5px * var(--tscale));
    background:rgba(255,255,255,.06);color:var(--ink);
    border:1px solid rgba(255,255,255,.18);padding:calc(6px * var(--tscale)) calc(8px * var(--tscale));
  }
  output{flex:0 0 calc(44px * var(--tscale));text-align:right;color:var(--hot);font-weight:600;font-variant-numeric:tabular-nums}
  input:focus-visible,select:focus-visible{outline:2px solid var(--hotter);outline-offset:2px}

  .binds{display:flex;flex-direction:column;gap:calc(5px * var(--tscale));max-height:calc(280px * var(--tscale));overflow-y:auto;padding-right:4px}
  .bindrow{display:grid;grid-template-columns:1fr auto auto;gap:calc(6px * var(--tscale));align-items:center}
  .bindname{font-size:calc(13.5px * var(--tscale));color:var(--dim)}
  .bindslot{
    min-width:calc(96px * var(--tscale));padding:calc(5px * var(--tscale)) calc(8px * var(--tscale));
    font-size:calc(12px * var(--tscale));letter-spacing:.04em;text-transform:none;
  }
  .bindslot.capturing{border-color:var(--hotter);background:rgba(255,217,138,.16);color:var(--hotter)}

  /* ---------- estatísticas ---------- */
  dl.stats{display:flex;flex-direction:column;gap:0;margin:calc(6px * var(--tscale)) 0 0}
  dl.stats > div{display:flex;justify-content:space-between;gap:calc(16px * var(--tscale));padding:calc(9px * var(--tscale)) 0;border-bottom:1px solid rgba(255,255,255,.08)}
  dl.stats dt{color:var(--dim);font-size:calc(14.5px * var(--tscale));margin:0}
  dl.stats dd{margin:0;font-weight:700;font-size:calc(16px * var(--tscale));font-variant-numeric:tabular-nums}
  dl.stats .record dd{color:var(--hotter)}

  /* ---------- cartas de Sopro ---------- */
  .cards{display:grid;grid-template-columns:1fr;gap:calc(14px * var(--tscale));margin-top:calc(16px * var(--tscale))}
  @media (min-width:760px){.cards{grid-template-columns:repeat(3,1fr)}}
  .card{
    display:flex;flex-direction:column;align-items:flex-start;gap:calc(7px * var(--tscale));
    text-align:left;text-transform:none;letter-spacing:0;
    padding:calc(20px * var(--tscale));min-width:0;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.03);
    position:relative;
  }
  .card .num{
    position:absolute;top:calc(10px * var(--tscale));right:calc(12px * var(--tscale));
    font-size:calc(13px * var(--tscale));color:var(--dim);font-weight:700;
  }
  .card .rar{font-size:calc(11px * var(--tscale));letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  .card strong{font-size:calc(21px * var(--tscale));font-weight:700;line-height:1.15}
  .card .desc{font-size:calc(14.5px * var(--tscale));color:#cdc3ba;line-height:1.45;font-weight:500}
  .card .stack{font-size:calc(12px * var(--tscale));color:var(--dim)}
  .card.comum:hover{border-color:#c9bfb0}
  .card.raro{border-color:rgba(127,200,255,.35)}
  .card.raro .rar,.card.raro strong{color:#7fc8ff}
  .card.raro:hover{background:rgba(127,200,255,.1);border-color:#7fc8ff}
  .card.epico{border-color:rgba(255,171,94,.45)}
  .card.epico .rar,.card.epico strong{color:#ffab5e}
  .card.epico:hover{background:rgba(255,171,94,.12);border-color:#ffab5e}

  @media (max-width:640px){
    .panel{padding:calc(20px * var(--tscale))}
    button{min-width:calc(170px * var(--tscale));font-size:calc(15px * var(--tscale))}
  }
</style>

<canvas id="game" tabindex="0" aria-label="BRASA — jogo de ação em arena"></canvas>
<div id="ui" hidden></div>
<script>__SCRIPT__</script>
